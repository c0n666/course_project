{% extends "base.html" %}
{% block title %}Sign In — Nutrition Tracker{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex h-14 w-14 rounded-2xl bg-brand-600 items-center justify-center text-white text-xl font-bold mb-4">NW</div>
      <h1 class="text-2xl font-bold text-slate-900">Nutrition & Workout Tracker</h1>
      <p class="text-slate-500 mt-1 text-sm">Personal health monitoring for athletes and trainers</p>
    </div>

    <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-8">
      <form method="post" action="{{ url_for('login') }}" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" id="email" name="email" required
                 class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none"
                 placeholder="you@university.edu">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input type="password" id="password" name="password" required
                 class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
        </div>
        <button type="submit"
                class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 rounded-lg transition text-sm">
          Sign in
        </button>
      </form>
      <p class="text-center text-sm text-slate-500 mt-6">
        No account?
        <a href="{{ url_for('register') }}" class="text-brand-600 hover:text-brand-700 font-medium">Create one</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
