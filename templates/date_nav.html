<nav class="inline-flex items-center gap-1 bg-white rounded-2xl shadow-card p-1.5" aria-label="Choose day">
  <a href="{{ date_nav.prev_url }}"
     class="press inline-flex items-center justify-center w-11 h-11 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-ink transition-colors"
     title="Previous day" aria-label="Previous day">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
  </a>
  <form method="get" action="{{ date_nav.base_url }}" class="flex items-center">
    <label for="nav-date" class="sr-only">Date</label>
    <input type="date" id="nav-date" name="date" value="{{ selected_date.isoformat() }}"
           onchange="this.form.submit()"
           class="h-11 rounded-xl border-0 bg-slate-50 px-3 text-sm font-medium text-ink tabular-nums hover:bg-slate-100 focus:ring-2 focus:ring-brand-500 outline-none transition-colors">
  </form>
  <a href="{{ date_nav.next_url }}"
     class="press inline-flex items-center justify-center w-11 h-11 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-ink transition-colors"
     title="Next day" aria-label="Next day">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
  </a>
  {% if selected_date != today %}
  <a href="{{ date_nav.today_url }}"
     class="press inline-flex items-center h-11 px-3 rounded-xl text-sm font-semibold text-brand-600 hover:bg-brand-50 transition-colors">
    Today
  </a>
  {% endif %}
</nav>
