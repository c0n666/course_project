<!doctype html>
<html lang="{{ current_lang|default('en') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#0f172a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f7;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:20px;padding:32px;">
          <tr>
            <td style="font-size:17px;font-weight:600;color:#047857;padding-bottom:20px;">Kolos</td>
          </tr>
          <tr>
            <td style="font-size:22px;font-weight:700;line-height:1.3;padding-bottom:12px;">{{ subject }}</td>
          </tr>
          <tr>
            <td style="font-size:15px;line-height:1.6;color:#334155;padding-bottom:24px;">{{ intro }}</td>
          </tr>
          <tr>
            <td style="padding-bottom:24px;">
              <a href="{{ url }}" style="display:inline-block;background:#047857;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:14px 24px;border-radius:12px;">{{ button }}</a>
            </td>
          </tr>
          <tr>
            <td style="font-size:13px;line-height:1.6;color:#64748b;">{{ note }}</td>
          </tr>
          <tr>
            <td style="font-size:12px;line-height:1.6;color:#94a3b8;padding-top:20px;word-break:break-all;">{{ url }}</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
